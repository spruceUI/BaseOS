name: device

# Builds one target and uploads it to the "beta" prerelease. Called by
# build-<target>.yml and build-all.yml. Inputs are prepared from the StockMod
# BASE image that manifest/prepared/<target>.json names, checked against that
# manifest so the boot files match the ones the native loader was audited on;
# the harvest comes from our manifest/harvest.list.

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      # Release version; empty means the build date (US Pacific)
      version:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Download StockMod image
        run: |
          src() { python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[sys.argv[2]][sys.argv[3]])' \
            "manifest/prepared/$TARGET.json" "$@"; }
          file="$(src source filename)"
          sum="$(src source sha256)"
          case "$file" in
            *-mod-v3.9.9.img) tag=20260605 ;;
            *-mod-v4.0.0.img) tag=20260805 ;;
            *) echo "no StockMod release known for $file" >&2; exit 1 ;;
          esac
          sudo mkdir -p /mnt/img
          sudo chown "$USER" /mnt/img
          gh release download "$tag" -R cbepx-me/Anbernic-H700-RG-xx-StockOS-Modification \
            -p "${file%.img}.7z.*" -D /mnt/img
          cd /mnt/img
          7z x -y -bd ./*.7z.001 >/dev/null
          rm -f ./*.7z.*
          echo "$sum  $file" | sha256sum -c -

      - name: Prepare
        run: |
          img="/mnt/img/$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source"]["filename"])' "manifest/prepared/$TARGET.json")"
          ./prepare-stock.sh "$TARGET" "$img"
          rm -f "$img"
          want="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["boot_prefix"]["sha256"])' "manifest/prepared/$TARGET.json")"
          echo "$want  work/$TARGET/boot-prefix.img" | sha256sum -c -

      - run: ./verify-target.sh "$TARGET"

      - uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ inputs.target }}
          path: |
            work/${{ inputs.target }}/source.json
            work/${{ inputs.target }}/boot-prefix.img
            work/${{ inputs.target }}/stock-harvest.tar
          retention-days: 3

  # The Vulkan driver cross-compiles on x86-64 and is the same for every target;
  # the cache keeps it to one build per change of vulkan/.
  vulkan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: cache
        with:
          path: work/vulkan
          key: baseos-vulkan-${{ hashFiles('vulkan/**') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: ./build-vulkan.sh

      - run: tar -C work -cf vulkan.tar vulkan

      - uses: actions/upload-artifact@v4
        with:
          name: vulkan-${{ inputs.target }}
          path: vulkan.tar
          retention-days: 3

  build:
    needs: [prepare, vulkan]
    runs-on: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: prepared-${{ inputs.target }}
          path: work/${{ inputs.target }}

      - uses: actions/download-artifact@v4
        with:
          name: vulkan-${{ inputs.target }}

      - run: tar -xf vulkan.tar -C work && rm vulkan.tar

      - name: Tools key
        run: tools/tools-stamp.sh > tools-stamp.txt

      - uses: actions/cache@v4
        with:
          path: work/tools
          key: baseos-tools-${{ hashFiles('tools-stamp.txt') }}

      - uses: actions/cache@v4
        with:
          path: work/audio-build/linux-4.9.170.tar.xz
          key: linux-4.9.170

      # The audio module's toolchain container has no curl; build-audio-module.sh
      # uses a cached archive and checks its SHA-256.
      - name: Kernel source for the audio module
        run: |
          mkdir -p work/audio-build
          [ -f work/audio-build/linux-4.9.170.tar.xz ] || curl -fL -o work/audio-build/linux-4.9.170.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.170.tar.xz
          echo "33887b40fc8e0b71f423bb7afe112a4ae190378145f4a3f3892c563b7e43131d  work/audio-build/linux-4.9.170.tar.xz" | sha256sum -c -

      - name: Version
        run: |
          v="${{ inputs.version }}"
          [ -n "$v" ] || v="$(TZ=America/Los_Angeles date +%Y.%m.%d)"
          echo "BASEOS_VERSION=$v" >> "$GITHUB_ENV"
          echo "Building $v"

      - uses: actions/cache@v4
        with:
          path: work/h700-loader/mainline/u-boot-v2026.10.tar.gz
          key: u-boot-v2026.10

      # build-all.sh builds the native loader: clang, the rustup ld.lld, a
      # Python with capstone and unicorn, and the SPL toolchain container.
      - name: Native loader tools
        run: |
          mkdir -p work/h700-loader/mainline
          a=work/h700-loader/mainline/u-boot-v2026.10.tar.gz
          [ -f "$a" ] || curl -fL -o "$a" https://github.com/u-boot/u-boot/archive/refs/tags/v2026.10.tar.gz
          echo "f943a88389c8fd70a6b0d061a88267465e143c7ca6ea2b75837ab20f5b60c739  $a" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          ls ~/.rustup/toolchains/*/lib/rustlib/*/bin/gcc-ld/ld.lld
          python3 -m venv work/native-venv
          work/native-venv/bin/pip install -q capstone unicorn
          echo "BASEOS_NATIVE_PYTHON=$PWD/work/native-venv/bin/python" >> "$GITHUB_ENV"
          docker run -d --name baseos-h700-mainline --platform linux/arm64 \
            ghcr.io/loveretro/h700-toolchain@sha256:bf5d8f9f5442cad789aa77176bc059ec823caefa3258bf30780eee681c777119 \
            sleep infinity
          docker exec baseos-h700-mainline sh -euc '
            apt-get update -qq
            apt-get install -y -qq bc bison flex libgnutls28-dev libssl-dev make python3 python3-dev python3-pyelftools python3-setuptools swig uuid-dev >/dev/null
            aarch64-linux-gnu-gcc --version | head -n 1'

      - run: ./build-all.sh "$TARGET"

      - name: SPL build logs
        if: failure()
        run: |
          docker exec baseos-h700-mainline sh -c \
            'for f in /tmp/baseos-release-spl-*/configure.log /tmp/baseos-release-spl-*/build.log; do echo "== $f"; tail -n 60 "$f"; done' || true

      - name: Upload to beta
        run: |
          version="$BASEOS_VERSION"
          gh release view beta >/dev/null 2>&1 || gh release create beta \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Beta" --notes "Beta builds. Not for general use." || true
          gh release upload beta --clobber \
            "work/$TARGET/baseos-$TARGET-$version.img.zip" \
            "work/$TARGET/baseos-$TARGET-$version.bosupd"

  sums:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: beta-sums
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild SHA256SUMS
        run: |
          gh release view beta -R "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name != "SHA256SUMS") | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload beta -R "$GITHUB_REPOSITORY" --clobber SHA256SUMS
