name: build-all

# Starts a fresh "beta" prerelease and builds every target into it.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # One date for every target, even if the run crosses midnight
      - id: version
        run: echo "version=$(TZ=America/Los_Angeles date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Recreate beta
        run: |
          gh release delete beta -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
          gh release create beta -R "$GITHUB_REPOSITORY" \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Beta" --notes "Beta builds. Not for general use."

  device:
    needs: reset
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: rg28xx }
          - { target: rg34xx }
          - { target: rg34xxsp }
          - { target: rg35xxplus }
          - { target: rg35xxh }
          - { target: rg35xxpro }
          - { target: rg35xxsp }
          - { target: rg40xxh }
          - { target: rg40xxv }
          - { target: rgcubexx }
          - { target: rgsp }
    uses: ./.github/workflows/device.yml
    with:
      target: ${{ matrix.target }}
      version: ${{ needs.reset.outputs.version }}
